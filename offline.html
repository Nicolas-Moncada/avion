<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sin Conexión — AERO FLOW AIRLINES</title>
  <style>
    :root {
      --bg: #070D18;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --accent-red: #DA291C;
      --accent-blue: #38BDF8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #0F172A 0%, #070D18 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .offline-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .radar-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      position: relative;
    }
    .radar-pulse {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent-red);
      opacity: 0.8;
      animation: pulseRing 2s infinite ease-out;
    }
    @keyframes pulseRing {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    .radar-center {
      position: absolute;
      inset: 16px;
      background: var(--accent-red);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(218, 41, 28, 0.6);
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn-retry {
      background: linear-gradient(135deg, var(--accent-red), #B91C1C);
      color: #FFFFFF;
      border: none;
      padding: 0.85rem 1.6rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 18px rgba(218, 41, 28, 0.35);
      transition: all 0.2s ease;
    }
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(218, 41, 28, 0.5);
    }
    .btn-retry:active {
      transform: translateY(0);
    }
    .brand-sub {
      margin-top: 2rem;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="radar-icon">
      <div class="radar-pulse"></div>
      <div class="radar-center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
    </div>
    <h1>Sin Señal de Telemetría</h1>
    <p>AERO FLOW AIRLINES requiere conexión a internet para sincronizar la telemetría satelital de vuelos, reservas en tiempo real y asignación de puertas en rampa.</p>
    <button class="btn-retry" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      Reintentar Conexión
    </button>
    <div class="brand-sub">Aero Flow Airlines • PWA Offline Core</div>
  </div>
</body>
</html>
