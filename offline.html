<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión — AERO FLOW AIRLINES</title>
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', 'JetBrains Mono', 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 15%, rgba(15, 23, 42, 0.96) 0%, rgba(7, 13, 24, 0.99) 100%);
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      max-width: 480px;
      text-align: center;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.7);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(218, 41, 28, 0.35));
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #F8FAFC;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      color: #94A3B8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, #DA291C 0%, #B51F14 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 0.85rem 1.5rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 20px -4px rgba(218, 41, 28, 0.45);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn:hover {
      background: linear-gradient(135deg, #EF4444 0%, #DA291C 100%);
      transform: translateY(-2px);
    }
    .btn:active { transform: translateY(0); }
    .status {
      margin-top: 1.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: #64748B;
    }
    .status.online { color: #10B981; }
    .status.offline { color: #EF4444; }
    @media (max-width: 520px) {
      .container { padding: 1.5rem 1rem; border-radius: 16px; }
      h1 { font-size: 1.25rem; }
      p { font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <rect width="64" height="64" rx="14" fill="#0b1220"/>
    <path d="M8 36 L26 32 L44 14 L50 16 L38 32 L54 30 L58 34 L38 38 L30 52 L25 50 L26 38 Z" fill="#DA291C" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  </svg>

  <div class="container">
    <h1>Sin Conexión a Internet</h1>
    <p>
      Parece que no tienes conexión a internet en este momento. Algunas funciones de AERO FLOW AIRLINES
      requieren conexión para consultar vuelos, reservar asientos y procesar pagos.
    </p>
    <button class="btn" onclick="reintentarConexion()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 4 9 12l-6 8M21 4l-6 8H4a2 2 0 0 1-2-2V4c0-1.1.9-2 2-2h16a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H6c-1.1 0-2-.9-2-2v-2a2 2 0 0 1 2-2z"/>
        <circle cx="15.5" cy="11.5" r="0.5" fill="currentColor" stroke="currentColor"/>
      </svg>
      Reintentar
    </button>
    <div class="status offline" id="estado-conexion">
      ● Sin conexión
    </div>
  </div>

  <script>
    function reintentarConexion() {
      const estado = document.getElementById('estado-conexion');
      if (navigator.onLine) {
        estado.textContent = '● Conexión restaurada';
        estado.className = 'status online';
        setTimeout(() => { window.location.reload(); }, 800);
      } else {
        estado.textContent = '● Aún sin conexión';
        estado.className = 'status offline';
      }
    }

    window.addEventListener('online', () => {
      const estado = document.getElementById('estado-conexion');
      estado.textContent = '● Conexión restaurada';
      estado.className = 'status online';
      setTimeout(() => { window.location.reload(); }, 800);
    });

    // Verificar estado inicial
    if (navigator.onLine) {
      document.getElementById('estado-conexion').textContent = '● Conexión restaurada';
      document.getElementById('estado-conexion').className = 'status online';
      setTimeout(() => { window.location.reload(); }, 800);
    }
  </script>
</body>
</html>
